services:
  mysql:
    image: mysql:8.0
    container_name: inffus_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inffus_db
      MYSQL_USER: inffus_user
      MYSQL_PASSWORD: inffus_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - inffus_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: inffus_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - mysql
    networks:
      - inffus_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: inffus_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - inffus_network

volumes:
  mysql_data:

networks:
  inffus_network:
    driver: bridge 